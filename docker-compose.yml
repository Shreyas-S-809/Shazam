# ============================================
# Song Shazam Pro — Docker Compose
# One-click: docker-compose up --build
# Backend: http://localhost:8000
# Frontend: http://localhost:3000
# ============================================

version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shazam-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./backend:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shazam-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Optional: Redis for caching / rate limiting (uncomment if needed)
  # redis:
  #   image: redis:7-alpine
  #   container_name: shazam-redis
  #   ports:
  #     - "6379:6379"
  #   restart: unless-stopped
