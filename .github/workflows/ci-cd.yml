name: CI/CD — Song Shazam Pro

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"

jobs:
  # ── Backend Tests ────────────────────────────────────────
  backend-test:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsndfile1 ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          ACR_HOST: test.acrcloud.com
          ACR_KEY: test_key
          ACR_SECRET: test_secret
          YOUTUBE_API_KEY: test_yt_key
        run: pytest tests/ -v --tb=short

  # ── Frontend Build ───────────────────────────────────────
  frontend-build:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://api.song-shazam-pro.onrender.com
        run: npm run build

  # ── Deploy Backend (Render) ──────────────────────────────
  deploy-backend:
    name: Deploy Backend → Render
    needs: [backend-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to Render
        run: |
          echo "🚀 Deploy backend to Render"
          echo "Configure Render Deploy Hook URL in repository secrets:"
          echo "  RENDER_DEPLOY_HOOK_BACKEND"
          # Uncomment when ready:
          # curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}"

  # ── Deploy Frontend (Vercel) ─────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    needs: [frontend-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to Vercel
        run: |
          echo "🚀 Deploy frontend to Vercel"
          echo "Vercel auto-deploys from GitHub — no manual step needed."
          echo "Alternatively, configure Vercel CLI deployment here."
